name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      artifact-id:
        type: string
        default: ''
      release-version:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - run: npm ci
      - run: npm run test:release
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        if: inputs.artifact-id != ''
        with:
          artifact-ids: ${{ inputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release
      - run: npm run release:check
        env:
          TYPELATCH_PACKAGE: ${{ inputs.artifact-id != '' && format('{0}/release/typelatch-{1}.tgz', runner.temp, inputs.release-version) || '' }}
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - run: npm ci
      - run: npm run test:release
      - run: npm run benchmark
      - run: npm run benchmark:workspace
      - run: npm run prove:support
      - run: npm run showcase:agent
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: benchmark-evidence
          path: |
            docs/benchmarks/*.json
            artifacts/support.json.gz
            docs/showcase/agent-workflow.json
            artifacts/agent-workflow.json.gz
