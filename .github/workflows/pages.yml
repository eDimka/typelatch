name: Publish website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm run site:check
      - name: Install isolated browser verification tools
        run: |
          npm install --prefix "$RUNNER_TEMP/typelatch-site-tools" --no-package-lock --no-save playwright@1.63.0 @axe-core/playwright@4.13.0
          "$RUNNER_TEMP/typelatch-site-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify browser workflows and accessibility
        run: node scripts/site-browsercheck.mjs
        env:
          TYPELATCH_BROWSER_TOOLS: ${{ runner.temp }}/typelatch-site-tools
          TYPELATCH_QA_DIR: ${{ runner.temp }}/typelatch-site-qa
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified static site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
